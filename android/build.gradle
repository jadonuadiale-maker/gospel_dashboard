allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// ADDED: forces every plugin subproject (audio_service, flutter_soloud, etc.)
// to compile against the same SDK level as the app, overriding whatever
// older default they ship with internally.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android.compileSdk = 36
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}